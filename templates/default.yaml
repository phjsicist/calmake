language: 'de'
no_of_weeks_per_line: 1
weekday_long_form: false

font:
  caption: 'Arial'
  month: 'Garamond'
  week: 'Arial'
  day: 'Arial'

color:
  caption: [0, 0, 0]
  month: [0, 0, 0]
  week: [0, 0, 0]
  day: [0, 0, 0]
  highlight: [0, 0, 0]

highlight:
  mode: ''
  weekdays: []

geometry:
  paper:
    width: 300
    height: 300
    margins:
      top: 20
      bottom: 20
      left: 20
      right: 20
  image:
    height: 0.75
    padding: 0.05
  grid:
    month_width: 0.4
    padding: 0.05
    row_height: 4
